
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>كل المنتجات | خصومات</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f6f7f9;color:#202124}
header{background:#fff;padding:16px;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px #0001}
.logo{font-size:24px;font-weight:800}.sub{color:#666;font-size:13px;margin-top:4px}
.search{margin-top:12px;width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;font-size:16px}
main{padding:16px;max-width:900px;margin:auto}.banner{background:linear-gradient(135deg,#ff6b35,#ffb000);color:#fff;border-radius:18px;padding:22px;margin-bottom:18px}
.banner h1{margin:0 0 7px;font-size:28px}.banner p{margin:0}.cats{display:flex;gap:8px;overflow:auto;margin-bottom:18px}.cat{border:0;background:#fff;padding:10px 14px;border-radius:20px;white-space:nowrap;box-shadow:0 1px 5px #0001;cursor:pointer}.cat.active{background:#111;color:#fff}
h2{font-size:20px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:#fff;border-radius:16px;padding:12px;box-shadow:0 2px 8px #0000000d}.pic{height:120px;border-radius:12px;background:#f1f3f5;display:flex;align-items:center;justify-content:center;font-size:55px}.name{font-weight:700;margin-top:10px}.old{text-decoration:line-through;color:#999;font-size:13px}.price{font-size:18px;font-weight:800;margin:3px 0 9px}.add{width:100%;border:0;background:#111;color:#fff;padding:10px;border-radius:10px;cursor:pointer}
.cart{position:fixed;bottom:16px;left:16px;right:16px;background:#111;color:#fff;border-radius:14px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 5px 20px #0003}.cart button{background:#ffb000;border:0;border-radius:10px;padding:9px 14px;font-weight:bold}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:10;align-items:end}.sheet{background:#fff;width:100%;max-height:80vh;border-radius:22px 22px 0 0;padding:18px;overflow:auto}.close{float:left;border:0;background:#eee;border-radius:50%;width:34px;height:34px}.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee}.checkout{width:100%;padding:13px;background:#ff6b35;color:#fff;border:0;border-radius:12px;font-size:16px;margin-top:14px}
@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
